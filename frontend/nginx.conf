server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Enable gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/xml+rss
    application/json
    application/manifest+json
    application/x-web-app-manifest+json;

  # index.html must NEVER be cached — fresh copy guarantees correct asset hashes
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Service worker: must always be revalidated for PWA update safety
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Manifest: keep fresh
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Static assets: content-hashed by Vite → cache forever, NEVER fall through to SPA
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Icons: content-hashed or versioned, safe to cache
  location /icons/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Catalog data: versioned, safe to cache
  location /catalog/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /kolibri/ {
    # CORS: allow the GitHub Pages dev preview (yancmo1.github.io) to borrow
    # this proxy. Same-origin production requests are unaffected. The preview
    # sends Authorization, which triggers a preflight, so answer OPTIONS here
    # instead of proxying it to Kolibri (which returns 401 without CORS).
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "https://yancmo1.github.io" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Accept" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0 always;
      return 204;
    }
    proxy_pass https://capsule.kolibrigames.com/api/client/v1/;
    proxy_set_header Host capsule.kolibrigames.com;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;
    proxy_ssl_server_name on;
    proxy_buffering off;
    add_header Access-Control-Allow-Origin "https://yancmo1.github.io" always;
    add_header Vary "Origin" always;
  }

  location /master/ {
    proxy_pass https://idle-miners.com/;
    proxy_set_header Host idle-miners.com;
    proxy_ssl_server_name on;
    proxy_buffering off;
  }

  # Telemetry beacon stubs — no backend collector is deployed yet. Return 204
  # so the client beacons stop producing 405 noise in the console.
  location = /api/vitals {
    return 204;
  }
  location = /api/errors {
    return 204;
  }

  # SPA fallback — only for non-file-looking paths (no extension)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
